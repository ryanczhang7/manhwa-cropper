name: gates

on:
  pull_request:
  push:
    branches: [main]

jobs:
  gates:
    # Windows, not ubuntu: the product is Windows-only (docs/wiki/product-brief.md),
    # eframe and rfd need X11/GTK development libraries on Linux that nothing
    # else here wants, and the coverage gate's ignore regex was verified against
    # the backslash paths cargo-llvm-cov prints on Windows (docs/wiki/environment.md).
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      # The toolchain the project.conf gate commands invoke (docs/wiki/stack.md).
      # Pinned to the same channel as rust-toolchain.toml so CI and a developer
      # machine compile the same compiler.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: clippy, rustfmt, llvm-tools
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2

      # The harness's own tests. They need nothing but bash and git, and they
      # guard the machinery every other check in this workflow depends on: the
      # phase lock, the path classifier, the quote-aware command parsing.
      - name: Harness self-test
        run: bash scripts/selftest.sh

      - name: Show configured gates
        run: bash scripts/gates.sh --list

      # Catches a gate whose command was emptied, whose cwd was moved away, or
      # whose evidence line was dropped - none of which the gate run itself can
      # report, because a gate that no longer does anything still exits 0.
      - name: Audit the gate manifest
        run: bash scripts/gates.sh --audit

      - name: Run gates
        run: bash scripts/gates.sh

      - name: Upload gate logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gate-logs
          path: .claude/state/gate-logs/
          if-no-files-found: ignore
