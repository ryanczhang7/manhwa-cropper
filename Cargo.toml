# Virtual workspace: no root package, so `cargo test` at the root has nothing
# to test on its own and `--workspace` (mandatory in every gate) is what runs
# the members. Layout and pins: docs/wiki/stack.md.

[workspace]
resolver = "3"
members = ["crates/core", "crates/engine", "crates/app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/ryanczhang7/manhwa-cropper"
publish = false

# Every pin lives here; member crates say `workspace = true`. Versions were
# confirmed with `cargo search` on 2026-09-10 (MC-001); exact resolutions are in
# Cargo.lock, which is committed because the workspace builds a binary.
[workspace.dependencies]
cropper-core = { path = "crates/core" }
cropper-engine = { path = "crates/engine" }

# engine
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "6"

# app
eframe = "0.36"
rfd = "0.17"

# dev
egui_kittest = "0.36"
tempfile = "3"
proptest = "1"

# Tests are compiled optimised (MC-006). The detector is a few dozen passes
# over an image, and MC-006 AC-4's generator - art up to 1200 px a side inside
# borders up to 200 - reaches 3184x3184, which is 10 Mpx a case at 256 cases.
# At the default `opt-level = 0` that suite takes `cargo test --workspace` from
# ~1 s to 99 s and the `coverage` gate from 7 s to 102 s; at `opt-level = 2`
# they are 6 s and 20 s. Measured on this machine, warm, and the instrumented
# run reports the identical 739 regions / 452 lines either way, so nothing
# about the coverage evidence or the 95% floor moves - only the wall clock.
#
# `2` rather than `3`: it is where the saving is, and it keeps compile time and
# debuginfo closer to the default for the eventual debugging session.
[profile.test]
opt-level = 2

# One small exe: docs/wiki/stack.md, "Release shape".
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
