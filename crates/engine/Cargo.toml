[package]
name = "cropper-engine"
description = "Files in, files out: codecs, naming, batch runner, settings, CLI args. No GUI."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
cropper-core = { workspace = true }
# MC-013: `settings` asks it where the config directory is when
# MANHWA_CROPPER_CONFIG_DIR is unset (`docs/wiki/architecture.md` decision 6).
directories = { workspace = true }
# A regular dependency rather than a dev-dependency: `codec` decodes and
# encodes with it (MC-008), and a regular dependency is also what the
# integration tests under `tests/` can `use`.
image = { workspace = true }
# MC-011: the batch runs on the rayon pool
# (`docs/wiki/architecture.md` decision 12).
rayon = { workspace = true }
# MC-011: `RunSummary` is serialised by the library itself - MC-012 writes it
# to disk and MC-015 renders it - so the derive is a regular dependency, the
# way `cropper-core` already takes it for `Rect` and `FlagReason`.
serde = { workspace = true }
# MC-013: the library itself now parses and writes JSON - `settings` reads and
# writes settings.json - so this moved up from [dev-dependencies], where it was
# only what tests/batch.rs used to pin the summary's shape. A regular
# dependency is still visible to the tests under `tests/`.
serde_json = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
