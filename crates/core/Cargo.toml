[package]
name = "cropper-core"
description = "Pixels in, crop decision out. No I/O, no GUI."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
# MC-007: `CropDecision` and `FlagReason` derive `Serialize` because MC-011's
# run summary carries them. A derive on a production type is a regular
# dependency, not a dev one; the test targets see it as well.
serde = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
# Only the tests read the bytes back (tests/decide.rs pins the plain derive's
# JSON), so this stays out of the library's own dependencies.
serde_json = { workspace = true }
